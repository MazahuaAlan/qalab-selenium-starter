# Registro de las pruebas: solo avisos importantes. Selenium y chromedriver emiten muchos WARNING por sesión
# (p. ej. versión de CDP que no coincide con el Chrome instalado), uno por cada prueba, y tapan lo útil.
handlers=java.util.logging.ConsoleHandler
.level=WARNING
java.util.logging.ConsoleHandler.level=WARNING
org.openqa.selenium.level=SEVERE
org.openqa.selenium.devtools.level=SEVERE
org.openqa.selenium.remote.level=SEVERE
org.openqa.selenium.manager.level=SEVERE
